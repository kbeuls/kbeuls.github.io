<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Katrien Beuls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --ink: #1C2430;
      --muted: #5B6675;
      --rule: #DDE2E8;
      --accent: #1F5F8B;
      --accent-soft: #E3EDF5;
      --banner-a: #1F5F8B;
      --banner-b: #9DB7CC;
      --serif: "Newsreader", Georgia, "Times New Roman", serif;
      --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12171E;
        --surface: #19202A;
        --ink: #E4E8EE;
        --muted: #9AA5B3;
        --rule: #2A3441;
        --accent: #7FB3DA;
        --accent-soft: #1E2E3D;
        --banner-a: #7FB3DA;
        --banner-b: #2F4A60;
      }
    }

    :root[data-theme="dark"] {
      --bg: #12171E;
      --surface: #19202A;
      --ink: #E4E8EE;
      --muted: #9AA5B3;
      --rule: #2A3441;
      --accent: #7FB3DA;
      --accent-soft: #1E2E3D;
      --banner-a: #7FB3DA;
      --banner-b: #2F4A60;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    html {
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    img {
      max-width: 100%;
    }

    /* Top bar */
    .topbar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 10;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .site-title {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 1.4rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      padding-bottom: 3px;
      border-bottom: 2px solid transparent;
    }

    nav a:hover {
      color: var(--ink);
    }

    nav a[aria-current="page"] {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    /* Banner: network image */
    .banner {
      height: 200px;
      overflow: hidden;
      border-bottom: 1px solid var(--rule);
      background: var(--surface);
    }

    .banner img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    :root[data-theme="dark"] .banner img { filter: brightness(0.8); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .banner img { filter: brightness(0.8); }
    }

    /* Layout */
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 3.5rem;
    }

    .sidebar {
      position: relative;
      margin-top: -64px;
    }

    .sidebar-inner {
      position: sticky;
      top: 90px;
    }

    .avatar {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      border: 4px solid var(--bg);
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: var(--serif);
      font-size: 3rem;
      color: var(--accent);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sidebar h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.45rem;
      margin: 1rem 0 0.2rem;
      line-height: 1.25;
    }

    .role {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 1.1rem;
    }

    .links {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.35rem;
      font-size: 0.95rem;
    }

    main {
      padding-top: 2.5rem;
      min-width: 0;
    }

    .page[hidden] {
      display: none;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 2.4rem;
      line-height: 1.15;
      margin: 0 0 1.5rem;
    }

    h3.year {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.5rem;
      margin: 2.5rem 0 0.8rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--rule);
    }

    .prose {
      max-width: 68ch;
    }

    .prose p {
      margin: 0 0 1.1rem;
    }

    .prose h3 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.35rem;
      margin: 2.2rem 0 0.6rem;
    }

    /* Year jump list */
    .jump {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.9rem;
      font-size: 0.92rem;
      margin: -0.5rem 0 1rem;
    }

    .jump a {
      color: var(--muted);
    }

    .note {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0 0 1rem;
    }

    .chip {
      font: inherit;
      font-size: 0.88rem;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 0.2rem 0.75rem;
      cursor: pointer;
    }

    .chip:hover {
      color: var(--ink);
      border-color: var(--muted);
    }

    .chip[aria-pressed="true"] {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .e-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.2rem 0.8rem;
      margin-top: 0.25rem;
    }

    .e-meta .e-links {
      margin-top: 0;
    }

    .tag {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .jump {
      margin: 0 0 1rem;
    }

    #projectList {
      margin-bottom: 1rem;
    }


    /* Entries */
    .entries {
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: 72ch;
    }

    .entries li {
      padding: 0.75rem 0;
    }

    .entries li+li {
      border-top: 1px dashed var(--rule);
    }

    .e-title {
      font-weight: 600;
    }

    .e-authors .me {
      text-decoration: underline;
      text-decoration-color: var(--rule);
      text-underline-offset: 3px;
    }

    .e-venue {
      font-style: italic;
      color: var(--muted);
    }

    .award {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0 0.45rem;
      border-radius: 3px;
      margin-left: 0.3rem;
    }

    .e-links {
      margin-top: 0.25rem;
      font-size: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem 0.7rem;
    }

    .e-links a::before {
      content: "[";
      color: var(--muted);
    }

    .e-links a::after {
      content: "]";
      color: var(--muted);
    }

    .news {
      list-style: none;
      padding: 0;
      margin: 0;
      max-width: 68ch;
    }

    .news li {
      display: grid;
      grid-template-columns: 6.5rem 1fr;
      gap: 1rem;
      padding: 0.4rem 0;
    }

    .news time {
      color: var(--muted);
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
    }

    footer {
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer div {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--rule);
      color: var(--muted);
      border-radius: 4px;
      padding: 0.15rem 0.6rem;
      font: inherit;
      cursor: pointer;
    }

    @media (max-width: 820px) {
      .wrap {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .sidebar {
        margin-top: 0;
      }

      .sidebar-inner {
        position: static;
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: 1.2rem;
        align-items: start;
      }

      .avatar {
        width: 110px;
        height: 110px;
        font-size: 2.2rem;
        grid-row: span 2;
        margin-top: -48px;
      }

      .sidebar h2 {
        margin-top: 0.7rem;
      }

      .role {
        margin-bottom: 0;
      }

      .links {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem 1rem;
        margin-top: 1rem;
      }

      .banner {
        height: 140px;
      }

      h1 {
        font-size: 2rem;
      }

      main {
        padding-top: 1.8rem;
      }

      .news li {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="site-title" href="#about" id="siteTitle">Your Name</a>
      <nav aria-label="Main">
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#publications">Publications</a></li>
          <li><a href="#talks">Talks</a></li>
          <li><a href="#teaching">Teaching</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="banner" aria-hidden="true"><img src="banner.jpg" alt=""></div>

  <div class="wrap">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="avatar" id="avatar">YN</div>
        <h2 id="sbName">Your Name</h2>
        <p class="role" id="sbRole"></p>
        <ul class="links" id="sbLinks"></ul>
      </div>
    </aside>

    <main>
      <section class="page" id="page-about">
        <h1>About</h1>
        <div class="prose" id="aboutText"></div>
        <div class="prose">
          <h3>Research projects</h3>
        </div>
        <ul class="entries" id="projectList"></ul>
        <div class="prose">
          <h3>News</h3>
        </div>
        <ul class="news" id="newsList"></ul>
      </section>

      <section class="page" id="page-publications" hidden>
        <h1>Publications</h1>
        <p class="note" id="pubNote"></p>
        <div class="chips" id="pubFilter" role="group" aria-label="Filter by type"></div>
        <div class="jump" id="pubJump" aria-label="Jump to year"></div>
        <div id="pubList"></div>
      </section>

      <section class="page" id="page-talks" hidden>
        <h1>Talks</h1>
        <div id="talkList"></div>
      </section>

      <section class="page" id="page-teaching" hidden>
        <h1>Teaching</h1>
        <div id="teachList"></div>
      </section>
    </main>
  </div>

  <footer>
    <div><span id="copy"></span><button class="theme-btn" id="themeBtn" type="button">Switch theme</button></div>
  </footer>

        "I am an associate professor at the Faculty of Computer Science of the Université de Namur, where I am part of the Namur Digital Institute (NaDI). My research asks how machines could learn and use language the way people do: through situated, communicative interactions with others, rather than from text alone.",
        "I work on computational construction grammar, and in particular [Fluid Construction Grammar](https://fcg-net.org); on the emergence of communication systems in populations of autonomous agents; and on neuro-symbolic approaches to grounded, human-interpretable language understanding.",
        "Before moving to Namur in 2022, I spent more than a decade at the Artificial Intelligence Lab of the Vrije Universiteit Brussel, first as a PhD student with Luc Steels and later as a postdoctoral researcher and guest professor. I studied speech and language processing at the University of Edinburgh and language and literature at KU Leuven.",
        "I am president of the [Evolutionary Linguistics Association](https://emergent-languages.org/ela/) and a member of ELLIS."

    /* ============================================================ */

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const inline = s => esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
    const authors = s => esc(s).replace(/\*([^*]+)\*/g, '<span class="me">$1</span>');
    const linkRow = links => links && links.length
      ? `<div class="e-links">${links.map(([l, u]) => `<a href="${esc(u)}">${esc(l)}</a>`).join("")}</div>` : "";
    const slug = y => "y-" + String(y).toLowerCase().replace(/[^a-z0-9]+/g, "-");
    const TYPES = ["Journal", "Conference", "Book chapter", "Workshop", "Edited volume", "Thesis"];
    const TYPE_LABEL = { "Journal": "Journal papers", "Conference": "Conference papers", "Book chapter": "Book chapters", "Workshop": "Workshop & other papers", "Edited volume": "Edited volumes", "Thesis": "Thesis" };
    let pubFilter = "all";

    function groupByYear(items) {
      const groups = new Map();
      items.forEach(it => { if (!groups.has(it.year)) groups.set(it.year, []); groups.get(it.year).push(it); });
      return [...groups.entries()].sort((a, b) => {
        const na = isNaN(+a[0]) ? 9999 : +a[0], nb = isNaN(+b[0]) ? 9999 : +b[0];
        return nb - na;
      });
    }

    function renderPubs() {
      const items = SITE.publications.filter(p => pubFilter === "all" || p.type === pubFilter);
      const groups = groupByYear(items);
      document.getElementById("pubJump").innerHTML = groups.map(([y]) => `<a href="#publications/${slug(y)}">${esc(y)}</a>`).join("");
      document.getElementById("pubList").innerHTML = groups.map(([y, list]) => `
    <h3 class="year" id="${slug(y)}">${esc(y)}</h3>
    <ul class="entries">${list.map(p => `
      <li>
        <div class="e-authors">${authors(p.authors)}</div>
        <div><span class="e-title">${esc(p.title)}.</span> <span class="e-venue">${esc(p.venue || "")}</span>${p.status ? `<span class="award">${esc(p.status)}</span>` : ""}</div>
        <div class="e-meta"><span class="tag">${esc(p.type)}</span>${linkRow(p.links)}</div>
      </li>`).join("")}</ul>`).join("");
      document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.type === pubFilter));
    }

    function render() {
      document.title = SITE.name;
      ["siteTitle", "sbName"].forEach(id => document.getElementById(id).textContent = SITE.name);
      document.getElementById("sbRole").textContent = SITE.role;
      const av = document.getElementById("avatar");
      if (SITE.photo) av.innerHTML = `<img src="${esc(SITE.photo)}" alt="Photo of ${esc(SITE.name)}">`;
      else av.textContent = SITE.initials;
      document.getElementById("sbLinks").innerHTML = SITE.links.map(l => `<li><a href="${esc(l.url)}">${esc(l.label)}</a></li>`).join("");
      document.getElementById("aboutText").innerHTML = SITE.about.map(p => `<p>${inline(p)}</p>`).join("");
      document.getElementById("projectList").innerHTML = SITE.projects.map(p => `
    <li><div><span class="e-title">${p.url ? `<a href="${esc(p.url)}">${esc(p.title)}</a>` : esc(p.title)}</span></div><div>${esc(p.text)}</div></li>`).join("");
      document.getElementById("newsList").innerHTML = SITE.news.map(n => `<li><time>${esc(n.date)}</time><span>${inline(n.text)}${n.url ? ` <a href="${esc(n.url)}">${esc(n.linkText || "Link")}</a>` : ""}</span></li>`).join("");
      document.getElementById("pubNote").innerHTML = SITE.scholarNote.replace("Google Scholar", `<a href="${esc(SITE.scholarUrl)}">Google Scholar</a>`);

      const counts = Object.fromEntries(TYPES.map(t => [t, SITE.publications.filter(p => p.type === t).length]));
      document.getElementById("pubFilter").innerHTML =
        `<button class="chip" type="button" data-type="all">All (${SITE.publications.length})</button>` +
        TYPES.filter(t => counts[t]).map(t => `<button class="chip" type="button" data-type="${esc(t)}">${esc(TYPE_LABEL[t])} (${counts[t]})</button>`).join("");
      document.getElementById("pubFilter").addEventListener("click", e => {
        const b = e.target.closest(".chip"); if (!b) return;
        pubFilter = b.dataset.type; renderPubs();
      });
      renderPubs();

      document.getElementById("talkList").innerHTML = groupByYear(SITE.talks).map(([y, list]) => `
    <h3 class="year">${esc(y)}</h3>
    <ul class="entries">${list.map(t => `
      <li><div class="e-title">${esc(t.title)}</div><div class="e-venue">${esc(t.where)}${t.date ? `, ${esc(t.date)}` : ""}</div>${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}</li>`).join("")}</ul>`).join("");

      document.getElementById("teachList").innerHTML = Object.keys(SITE.teaching).map(k => `
    <h3 class="year">${esc(k)}</h3>
    <ul class="entries">${SITE.teaching[k].map(t => `
      <li><div class="e-title">${esc(t.title)}</div><div class="e-venue">${esc(t.where)}</div>${linkRow(t.links)}</li>`).join("")}</ul>`).join("");
      document.getElementById("copy").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;
    }

    /* Hash routing: #about, #publications, #publications/y-2025, and so on */
    const PAGES = ["about", "publications", "talks", "teaching"];
    function route() {
      const [page, anchor] = (location.hash.slice(1) || "about").split("/");
      const current = PAGES.includes(page) ? page : "about";
      PAGES.forEach(p => document.getElementById("page-" + p).hidden = p !== current);
      document.querySelectorAll("nav a").forEach(a => {
        if (a.getAttribute("href") === "#" + current) a.setAttribute("aria-current", "page");
        else a.removeAttribute("aria-current");
      });
      const target = anchor && document.getElementById(anchor);
      if (target) target.scrollIntoView();
      else window.scrollTo(0, 0);
    }
    /* Banner: quiet contour lines, seeded from the name so they stay the same */
    function banner() {
      const svg = document.getElementById("banner");
      const W = 1600, H = 240;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      let seed = [...SITE.name].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
      const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
      const waves = Array.from({ length: 4 }, () => ({ f: 0.002 + rnd() * 0.006, p: rnd() * 6.28, a: 8 + rnd() * 22 }));
      let paths = "";
      const n = 22;
      for (let i = 0; i < n; i++) {
        const base = (i / (n - 1)) * (H + 40) - 20;
        let d = "";
        for (let x = 0; x <= W; x += 16) {
          let y = base;
          waves.forEach((w, k) => { y += Math.sin(x * w.f + w.p + i * 0.18 * (k + 1)) * w.a * (0.4 + i / n); });
          d += (x ? "L" : "M") + x + " " + y.toFixed(1);
        }
        const t = i / (n - 1);
        paths += `<path d="${d}" fill="none" stroke="${t > 0.5 ? "var(--banner-a)" : "var(--banner-b)"}" stroke-width="${(0.8 + t * 0.9).toFixed(2)}" opacity="${(0.25 + t * 0.6).toFixed(2)}"/>`;
      }
      svg.innerHTML = paths;
    }

    /* Theme toggle (remembered per viewer) */
    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) { }
      if (saved) document.documentElement.dataset.theme = saved;
      document.getElementById("themeBtn").addEventListener("click", () => {
        const dark = document.documentElement.dataset.theme
          ? document.documentElement.dataset.theme === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        const next = dark ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) { }
      });
    }

    render(); initTheme(); route();
    window.addEventListener("hashchange", route);
  </script>
